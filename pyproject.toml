[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tr-pii"
version = "0.1.0"
description = "Offline detection and masking of personal data in Turkish text"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Yusuf Berat Zengin"}]
keywords = ["pii", "turkish", "masking", "privacy", "redaction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[project.scripts]
tr-pii = "tr_pii.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_pii"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/is/benchmark.py", "/*.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".devtools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "is/benchmark.py"]
mypy_path = "src"

