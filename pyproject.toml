[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tr-pii"
version = "0.1.0"
description = "Offline detection and masking of personal data in Turkish text"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yusuf Berat Zengin", email = "118852217+YusufBeratZengin@users.noreply.github.com" }]
keywords = [
  "pii",
  "turkish",
  "masking",
  "privacy",
  "redaction",
  "tckn",
  "iban",
  "kvkk",
  "gdpr",
  "anonymization",
  "llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Turkish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "build>=1.2,<2",
  "twine>=5,<8",
]

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/tr-pii"
Source = "https://github.com/YusufBeratZengin/tr-pii"
Issues = "https://github.com/YusufBeratZengin/tr-pii/issues"
Changelog = "https://github.com/YusufBeratZengin/tr-pii/blob/main/CHANGELOG.md"

[project.scripts]
tr-pii = "tr_pii.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_pii"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/examples", "/docs", "/*.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=tr_pii --cov-branch --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".devtools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
