name: Bug report
description: Report a reproducible problem with detection, masking, or the CLI.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Use synthetic data only: tr_pii.fake, invented terms, .invalid domains,
        or documentation IP ranges. Never include personal data, credentials,
        private salts, or confidential documents. See SECURITY.md for private
        vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: tr-pii version
      description: Output of python -m tr_pii --version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and output of python --version.
      placeholder: Windows 11, Python 3.14
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact commands or Python code using synthetic input only.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and output
      description: Remove private values and machine paths from errors before sharing.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains only synthetic examples and no private data or secrets.
          required: true
