name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m build
      - name: Verify installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv /tmp/tr-pii-wheel
          /tmp/tr-pii-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/tr-pii-wheel/bin/python -c 'import tr_pii; assert tr_pii.mask("dummy@example.invalid") == "[EMAIL]"'
          /tmp/tr-pii-wheel/bin/tr-pii --version

