name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m tr_pii --version
      - run: python -m build
      - name: Verify installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/tr-pii-wheel"
          "${RUNNER_TEMP}/tr-pii-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/tr-pii-wheel/bin/python" -c 'import tr_pii; assert tr_pii.mask("dummy@example.invalid") == "[EMAIL]"'
          "${RUNNER_TEMP}/tr-pii-wheel/bin/python" -m tr_pii --version
          "${RUNNER_TEMP}/tr-pii-wheel/bin/tr-pii" --version
          echo "dummy@example.invalid" > "${RUNNER_TEMP}/sample-pii.txt"
          set +e
          "${RUNNER_TEMP}/tr-pii-wheel/bin/tr-pii" scan "${RUNNER_TEMP}/sample-pii.txt"
          status=$?
          set -e
          [ "$status" -eq 3 ]

  windows:
    name: Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m tr_pii --version
      - run: python -m build
      - name: Verify installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/tr-pii-wheel"
          "${RUNNER_TEMP}/tr-pii-wheel/Scripts/python" -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/tr-pii-wheel/Scripts/python" -c 'import tr_pii; assert tr_pii.mask("dummy@example.invalid") == "[EMAIL]"'
          "${RUNNER_TEMP}/tr-pii-wheel/Scripts/python" -m tr_pii --version
          "${RUNNER_TEMP}/tr-pii-wheel/Scripts/tr-pii" --version
          echo "dummy@example.invalid" > "${RUNNER_TEMP}/sample-pii.txt"
          set +e
          "${RUNNER_TEMP}/tr-pii-wheel/Scripts/tr-pii" scan "${RUNNER_TEMP}/sample-pii.txt"
          status=$?
          set -e
          [ "$status" -eq 3 ]
